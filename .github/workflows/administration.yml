name: Administration

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  worker-tests:
    name: Reachability Worker tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Run Worker tests
        run: node --test workers/app-url-reachability/src/index.test.mjs

  administration-tests:
    name: Tests (Shopware ${{ matrix.shopware }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shopware: '6.6'
            administration_repository: shopware/administration
            administration_ref: v6.6.10.23
            administration_subdir: Resources/app/administration
          - shopware: '6.7'
            administration_repository: shopware/administration
            administration_ref: v6.7.15.0
            administration_subdir: Resources/app/administration
          - shopware: 'trunk'
            administration_repository: shopware/shopware
            administration_ref: trunk
            administration_subdir: src/Administration/Resources/app/administration
    env:
      SHOPWARE_ADMINISTRATION_PATH: ${{ github.workspace }}/.shopware/administration/${{ matrix.administration_subdir }}
    steps:
      - name: Checkout plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout Shopware Administration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ matrix.administration_repository }}
          ref: ${{ matrix.administration_ref }}
          path: .shopware/administration

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/Resources/app/administration/package-lock.json
            .shopware/administration/${{ matrix.administration_subdir }}/package-lock.json

      - name: Install plugin Administration dependencies
        working-directory: src/Resources/app/administration
        run: npm ci

      - name: Install Shopware Administration dependencies
        working-directory: .shopware/administration/${{ matrix.administration_subdir }}
        run: npm ci --ignore-scripts

      - name: Diagnose Shopware environment
        working-directory: src/Resources/app/administration
        run: npx vitest-shopware-admin-bridge doctor --json

      - name: Run Administration tests
        working-directory: src/Resources/app/administration
        run: npm run test:unit

      - name: Build Administration with webpack (development resolve conditions)
        if: matrix.shopware == '6.6'
        working-directory: .shopware/administration/${{ matrix.administration_subdir }}
        env:
          PROJECT_ROOT: ${{ runner.temp }}/shopware-project
          SHOPWARE_ADMIN_BUILD_ONLY_EXTENSIONS: '1'
          mode: production
        run: |
          mkdir -p "$PROJECT_ROOT/var"
          jq -n --arg basePath "$GITHUB_WORKSPACE/src/" '{FroshTools: {basePath: $basePath, technicalName: "frosh-tools", administration: {path: "Resources/app/administration/src", entryFilePath: "Resources/app/administration/src/main.js", webpack: "Resources/app/administration/build/webpack.config.cjs"}}}' > "$PROJECT_ROOT/var/plugins.json"
          node --no-deprecation ./node_modules/webpack/bin/webpack.js --config webpack.config.js --mode development
