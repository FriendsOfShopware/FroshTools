name: Packaging

on:
  pull_request:
    paths:
      - .gitattributes
      - .shopware-extension.yml
      - composer.json
      - tests/packaging/**
      - .github/workflows/packaging.yml
  push:
    branches:
      - main
    paths:
      - .gitattributes
      - .shopware-extension.yml
      - composer.json
      - tests/packaging/**
      - .github/workflows/packaging.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shopware/shopware-cli-action@v3
      - name: Check release and Composer archives
        run: python3 tests/packaging/check_archives.py
